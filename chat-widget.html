<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат-консультант | Ленканал</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ============================================
   CHAT WIDGET STYLES
   Вставьте этот CSS на ваш сайт
   ============================================ */
        :root {
            --chat-primary: #2f990c;
            --chat-primary-light: #3abf10;
            --chat-accent: #f39c12;
            --chat-bg: #f0f4f8;
            --chat-user-bubble: #2f990c;
            --chat-bot-bubble: #ffffff;
            --chat-text: #2c3e50;
            --chat-text-light: #7f8c8d;
            --chat-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
            --chat-radius: 16px;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #e8edf2;
            min-height: 100vh;
        }
        /* ---- Toggle Button ---- */
        #chat-toggle {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--chat-primary), var(--chat-primary-light));
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(26, 82, 118, 0.4);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #chat-toggle:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 28px rgba(26, 82, 118, 0.5);
        }
        #chat-toggle svg {
            width: 28px;
            height: 28px;
            transition: transform 0.3s ease;
        }
        #chat-toggle.active svg {
            transform: rotate(90deg);
        }
        /* Notification badge */
        #chat-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 20px;
            height: 20px;
            background: #e74c3c;
            border-radius: 50%;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse-badge 2s ease-in-out infinite;
        }
        @keyframes pulse-badge {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
        }
        /* ---- Chat Window ---- */
        #chat-window {
            position: fixed;
            bottom: 100px;
            right: 24px;
            width: 400px;
            max-width: calc(100vw - 32px);
            height: 560px;
            max-height: calc(100vh - 140px);
            background: var(--chat-bg);
            border-radius: var(--chat-radius);
            box-shadow: var(--chat-shadow);
            z-index: 99998;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #chat-window.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: all;
        }
        /* ---- Header ---- */
        #chat-header {
            background: linear-gradient(135deg, var(--chat-primary), var(--chat-primary-light));
            color: #fff;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        #chat-header-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        #chat-header-info h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        #chat-header-info p {
            font-size: 12px;
            opacity: 0.85;
        }
        #chat-header-status {
            width: 8px;
            height: 8px;
            background: #2ecc71;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
            animation: status-pulse 2s ease-in-out infinite;
        }
        @keyframes status-pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        /* ---- Messages Area ---- */
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }
        #chat-messages::-webkit-scrollbar {
            width: 5px;
        }
        #chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        #chat-messages::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 10px;
        }
        /* ---- Message Bubbles ---- */
        .chat-msg {
            display: flex;
            gap: 8px;
            max-width: 88%;
            animation: msg-in 0.3s ease-out;
        }
        @keyframes msg-in {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .chat-msg.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .chat-msg.bot {
            align-self: flex-start;
        }
        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .chat-msg.bot .msg-avatar {
            background: linear-gradient(135deg, var(--chat-primary), var(--chat-primary-light));
            color: #fff;
        }
        .chat-msg.user .msg-avatar {
            background: #dfe6ed;
            color: var(--chat-text);
        }
        .msg-bubble {
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.55;
            word-break: break-word;
        }
        .chat-msg.bot .msg-bubble {
            background: var(--chat-bot-bubble);
            color: var(--chat-text);
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }
        .chat-msg.user .msg-bubble {
            background: var(--chat-user-bubble);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        /* Links in bot messages */
        .msg-bubble a {
            color: var(--chat-primary-light);
            text-decoration: underline;
            text-decoration-color: rgba(41, 128, 185, 0.3);
            transition: text-decoration-color 0.2s;
        }
        .msg-bubble a:hover {
            text-decoration-color: var(--chat-primary-light);
        }
        /* ---- Typing Indicator ---- */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #bdc3c7;
            border-radius: 50%;
            animation: typing-dot 1.4s ease-in-out infinite;
        }
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes typing-dot {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }
        /* ---- Input Area ---- */
        #chat-input-area {
            padding: 12px 16px;
            background: #fff;
            border-top: 1px solid #e8ecf0;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        #chat-input {
            flex: 1;
            border: 1.5px solid #dfe6ed;
            border-radius: 24px;
            padding: 10px 18px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
            background: #f8fafc;
            color: var(--chat-text);
        }
        #chat-input:focus {
            border-color: var(--chat-primary-light);
            background: #fff;
        }
        #chat-input::placeholder {
            color: #aab5c0;
        }
        #chat-send {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--chat-primary), var(--chat-primary-light));
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        #chat-send:hover {
            transform: scale(1.06);
            box-shadow: 0 2px 12px rgba(26, 82, 118, 0.3);
        }
        #chat-send:active {
            transform: scale(0.96);
        }
        #chat-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        #chat-send svg {
            width: 18px;
            height: 18px;
        }
        /* ---- Powered by ---- */
        #chat-footer {
            text-align: center;
            padding: 6px;
            font-size: 11px;
            color: var(--chat-text-light);
            background: #fff;
        }
        #chat-footer a {
            color: var(--chat-primary-light);
            text-decoration: none;
        }
        /* ---- Quick Actions ---- */
        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .quick-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1.5px solid var(--chat-primary-light);
            background: transparent;
            color: var(--chat-primary);
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }
        .quick-btn:hover {
            background: var(--chat-primary-light);
            color: #fff;
        }
        /* ---- Mobile ---- */
        @media (max-width: 480px) {
            #chat-window {
                bottom: 0;
                right: 0;
                width: 100vw;
                max-width: 100vw;
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
            }
            #chat-toggle {
                bottom: 16px;
                right: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- ============================================
     CHAT WIDGET HTML
     ============================================ -->
    <!-- Toggle Button -->
    <button id="chat-toggle" aria-label="Открыть чат">
        <span id="chat-badge">1</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg>
    </button>
    <!-- Chat Window -->
    <div id="chat-window">
        <div id="chat-header">
            <div id="chat-header-avatar">💧</div>
            <div id="chat-header-info">
                <h3>Консультант Ленканал</h3>
                <p><span id="chat-header-status"></span>Онлайн — отвечаем моментально</p>
            </div>
        </div>
        <div id="chat-messages"></div>
        <div id="chat-input-area">
            <input id="chat-input" type="text" placeholder="Напишите ваш вопрос..." autocomplete="off" />
            <button id="chat-send" aria-label="Отправить">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                </svg>
            </button>
        </div>
        <div id="chat-footer">
            <a href="https://lenkanal.ru" target="_blank">lenkanal.ru</a> — септики и автономные канализации
        </div>
    </div>
    <script>
        /* ============================================
           CHAT WIDGET LOGIC
           ============================================ */
        (function () {
            // =============================================
            // ⚠️  ЗАМЕНИТЕ НА ВАШ WEBHOOK URL ИЗ MAKE.COM
            // =============================================
            const WEBHOOK_URL = 'https://hook.us2.make.com/q4j6zcnhjwg6fdbti5ne8h5nsfes8co1';
            const toggle = document.getElementById('chat-toggle');
            const window_ = document.getElementById('chat-window');
            const messages = document.getElementById('chat-messages');
            const input = document.getElementById('chat-input');
            const sendBtn = document.getElementById('chat-send');
            const badge = document.getElementById('chat-badge');
            let isOpen = false;
            let sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            let isWaiting = false;
            // --- Toggle Chat ---
            toggle.addEventListener('click', () => {
                isOpen = !isOpen;
                window_.classList.toggle('open', isOpen);
                toggle.classList.toggle('active', isOpen);
                badge.style.display = 'none';
                if (isOpen && messages.children.length === 0) {
                    showWelcome();
                }
                if (isOpen) {
                    setTimeout(() => input.focus(), 400);
                }
            });
            // --- Welcome Message ---
            function showWelcome() {
                addBotMessage(
                    'Здравствуйте! 👋 Я консультант магазина <b>Ленканал</b>. ' +
                    'Помогу подобрать септик или автономную канализацию для вашего дома.\n\n' +
                    'Расскажите, что вас интересует?'
                );
                const quickBtns = [
                    'Подобрать септик',
                    'Узнать цену',
                    'Для дачи на 4 чел.',
                    'Без электричества'
                ];
                addQuickActions(quickBtns);
            }
            // --- Send Message ---
            function sendMessage() {
                const text = input.value.trim();
                if (!text || isWaiting) return;
                addUserMessage(text);
                input.value = '';
                isWaiting = true;
                sendBtn.disabled = true;
                const typingEl = showTyping();
                fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        session_id: sessionId
                    })
                })
                    .then(res => {
                        if (!res.ok) throw new Error('Network error: ' + res.status);
                        return res.text(); // Get raw text first
                    })
                    .then(rawText => {
                        removeTyping(typingEl);
                        console.log('Raw response:', rawText);
                        let reply = '';
                        // Try to parse as JSON
                        try {
                            const data = JSON.parse(rawText);
                            reply = data.reply || data.message || data.text || data.response || '';
                        } catch (e) {
                            // JSON parse failed — extract text with regex
                            const match = rawText.match(/"reply"\s*:\s*"([\s\S]+)/);
                            if (match) {
                                reply = match[1].replace(/"\s*\}\s*$/, '');
                            } else {
                                reply = rawText
                                    .replace(/^\s*\{\s*"reply"\s*:\s*"?/, '')
                                    .replace(/"?\s*\}\s*$/, '');
                            }
                        }
                        // Clean up escaped characters
                        reply = reply
                            .replace(/\\n/g, '\n')
                            .replace(/\\"/g, '"')
                            .replace(/\\\\/g, '\\')
                            .replace(/^["']|["']$/g, '');
                        if (!reply || reply === '{}' || reply === 'Accepted') {
                            reply = 'Извините, не удалось получить ответ. Попробуйте переформулировать вопрос или позвоните: <b>+7 (812) 409-96-30</b>';
                        }
                        addBotMessage(reply);
                    })
                    .catch(err => {
                        removeTyping(typingEl);
                        addBotMessage(
                            'Извините, произошла ошибка соединения. Попробуйте позже или позвоните нам: ' +
                            '<b>+7 (812) 409-96-30</b>'
                        );
                        console.error('Chat error:', err);
                    })
                    .finally(() => {
                        isWaiting = false;
                        sendBtn.disabled = false;
                        input.focus();
                    });
            }
            // --- Event Listeners ---
            sendBtn.addEventListener('click', sendMessage);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            // --- Message Helpers ---
            function addUserMessage(text) {
                const div = document.createElement('div');
                div.className = 'chat-msg user';
                div.innerHTML = `
      <div class="msg-avatar">👤</div>
      <div class="msg-bubble">${escapeHtml(text)}</div>
    `;
                messages.appendChild(div);
                scrollToBottom();
            }
            function addBotMessage(text) {
                const div = document.createElement('div');
                div.className = 'chat-msg bot';
                div.innerHTML = `
      <div class="msg-avatar">💧</div>
      <div class="msg-bubble">${formatMessage(text)}</div>
    `;
                messages.appendChild(div);
                scrollToBottom();
            }
            function addQuickActions(buttons) {
                const lastMsg = messages.lastElementChild;
                if (!lastMsg) return;
                const bubble = lastMsg.querySelector('.msg-bubble');
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'quick-actions';
                buttons.forEach(label => {
                    const btn = document.createElement('button');
                    btn.className = 'quick-btn';
                    btn.textContent = label;
                    btn.addEventListener('click', () => {
                        input.value = label;
                        sendMessage();
                        // Remove quick actions after click
                        actionsDiv.remove();
                    });
                    actionsDiv.appendChild(btn);
                });
                bubble.appendChild(actionsDiv);
            }
            function showTyping() {
                const div = document.createElement('div');
                div.className = 'chat-msg bot';
                div.id = 'typing-msg';
                div.innerHTML = `
      <div class="msg-avatar">💧</div>
      <div class="msg-bubble">
        <div class="typing-indicator">
          <span></span><span></span><span></span>
        </div>
      </div>
    `;
                messages.appendChild(div);
                scrollToBottom();
                return div;
            }
            function removeTyping(el) {
                if (el && el.parentNode) el.parentNode.removeChild(el);
            }
            function scrollToBottom() {
                requestAnimationFrame(() => {
                    messages.scrollTop = messages.scrollHeight;
                });
            }
            // --- Text Formatting ---
            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
            function formatMessage(text) {
                if (!text) return '';
                // Convert line breaks
                let html = text.replace(/\n/g, '<br>');
                // Convert markdown bold **text**
                html = html.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
                // Convert URLs to links
                html = html.replace(
                    /(https?:\/\/[^\s<]+)/g,
                    '<a href="$1" target="_blank" rel="noopener">$1</a>'
                );
                // Convert phone numbers to tel: links
                html = html.replace(
                    /(\+7\s*\(\d{3}\)\s*\d{3}[\-\s]?\d{2}[\-\s]?\d{2})/g,
                    '<a href="tel:$1">$1</a>'
                );
                return html;
            }
        })();
    </script>
</body>
</html>
